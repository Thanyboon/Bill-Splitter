<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Bill App</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 30px auto; padding: 20px; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #45a049; }
        ul { padding-left: 20px; }
    </style>
</head>
<body>
    <h2>💰 ระบบบันทึกบิลค่าใช้จ่าย (Real-time)</h2>
    
    <input type="text" id="billName" placeholder="ชื่อรายการ (เช่น ค่าไฟ, ค่าเน็ต)">
    <input type="number" id="billAmount" placeholder="จำนวนเงิน (บาท)">
    <button onclick="saveBill()">บันทึกข้อมูล</button>

    <h3>รายการบิลทั้งหมด:</h3>
    <ul id="billList"></ul>

    <!-- โหลด Firebase SDK แบบ Modular ผ่าน CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ค่า Config ของโปรเจกต์คุณ (mybillapp-c5d32)
        const firebaseConfig = {
            apiKey: "AIzaSyAD7sIBtN-eiN7UQw7OJttz1Ckzv7mNY7g",
            authDomain: "mybillapp-c5d32.firebaseapp.com",
            databaseURL: "https://mybillapp-c5d32-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "mybillapp-c5d32",
            storageBucket: "mybillapp-c5d32.firebasestorage.app",
            messagingSenderId: "1070633330703",
            appId: "1:1070633330703:web:1fa84c2cbead2665155b7a",
            measurementId: "G-P8F903513F"
        };

        // เริ่มต้นเชื่อมต่อ Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ฟังก์ชันสำหรับกดบันทึกข้อมูล
        window.saveBill = function() {
            const name = document.getElementById("billName").value;
            const amount = document.getElementById("billAmount").value;

            if (!name || !amount) {
                alert("กรุณากรอกข้อมูลให้ครบถ้วนครับ");
                return;
            }

            const billsRef = ref(db, 'bills');
            const newBillRef = push(billsRef);

            set(newBillRef, {
                name: name,
                amount: Number(amount),
                createdAt: Date.now()
            }).then(() => {
                document.getElementById("billName").value = "";
                document.getElementById("billAmount").value = "";
            }).catch((error) => {
                console.error("เกิดข้อผิดพลาด: ", error);
            });
        };

        // ฟังก์ชันดึงและอัปเดตข้อมูลแบบ Real-time บนหน้าจอ
        const billsRef = ref(db, 'bills');
        onValue(billsRef, (snapshot) => {
            const data = snapshot.val();
            const billList = document.getElementById("billList");
            billList.innerHTML = "";

            if (data) {
                Object.keys(data).forEach((key) => {
                    const bill = data[key];
                    const li = document.createElement("li");
                    li.textContent = `${bill.name} : ${bill.amount.toLocaleString()} บาท`;
                    billList.appendChild(li);
                });
            } else {
                billList.innerHTML = "<li>ยังไม่มีรายการบิลในระบบ</li>";
            }
        });
    </script>
</body>
</html>
